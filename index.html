<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture Particle Control</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      touch-action: none; /* Mencegah scroll saat kontrol 360 di HP */
    }
    #webcam {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 90px;
      border-radius: 10px;
      border: 2px solid #00ffcc;
      transform: scaleX(-1);
      z-index: 10;
      object-fit: cover;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffcc;
      font-size: 18px;
      pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">Memuat model & kamera...</div>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <script>
    const PARTICLE_COUNT = 5000;
    let scene, camera, renderer, particleSystem, controls;
    let positions, colors, targetPositions, targetColors;
    let currentMode = 'scatter';

    // 1. Inisialisasi Visual 3D + Fitur 360° Kamera (OrbitControls)
    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 120;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Kontrol interaktif 360° (Bisa di-drag / di-rotate menggunakan jari atau mouse)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const geometry = new THREE.BufferGeometry();
      positions = new Float32Array(PARTICLE_COUNT * 3);
      colors = new Float32Array(PARTICLE_COUNT * 3);
      targetPositions = new Float32Array(PARTICLE_COUNT * 3);
      targetColors = new Float32Array(PARTICLE_COUNT * 3);

      generateScatterTarget();

      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = targetPositions[i];
        colors[i] = targetColors[i];
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // 2. Generator Bentuk Partikel
    function generateScatterTarget() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        targetPositions[i * 3] = (Math.random() - 0.5) * 220;
        targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 220;
        targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 220;

        targetColors[i * 3] = 0.8;
        targetColors[i * 3 + 1] = 0.8;
        targetColors[i * 3 + 2] = 1.0;
      }
    }

    function generateHeartTarget(scale = 2.2, r = 1.0, g = 0.2, b = 0.4) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        targetPositions[i * 3] = (x + (Math.random() - 0.5) * 2) * scale;
        targetPositions[i * 3 + 1] = (y + (Math.random() - 0.5) * 2) * scale;
        targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;

        targetColors[i * 3] = r;
        targetColors[i * 3 + 1] = g;
        targetColors[i * 3 + 2] = b;
      }
    }

    // Generator Saturnus (Planet + Cincin 3D)
    function generateSaturnTarget() {
      const planetParticles = Math.floor(PARTICLE_COUNT * 0.4);
      const ringParticles = PARTICLE_COUNT - planetParticles;

      // Partikel Planet (Bola)
      for (let i = 0; i < planetParticles; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 18;

        targetPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        targetPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        targetPositions[i * 3 + 2] = r * Math.cos(phi);

        targetColors[i * 3] = 0.9;
        targetColors[i * 3 + 1] = 0.7;
        targetColors[i * 3 + 2] = 0.4;
      }

      // Partikel Cincin Saturnus
      for (let i = planetParticles; i < PARTICLE_COUNT; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = 28 + Math.random() * 22;

        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;
        const y = (Math.random() - 0.5) * 2;

        // Miringkan cincin sedikit
        const tilt = 0.4;
        targetPositions[i * 3] = x;
        targetPositions[i * 3 + 1] = y * Math.cos(tilt) - z * Math.sin(tilt);
        targetPositions[i * 3 + 2] = y * Math.sin(tilt) + z * Math.cos(tilt);

        targetColors[i * 3] = 0.8;
        targetColors[i * 3 + 1] = 0.8;
        targetColors[i * 3 + 2] = 0.9;
      }
    }

    // Generator Teks Kostumisasi
    function generateTextTarget(text, r = 0.2, g = 1.0, b = 0.5) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 500;
      canvas.height = 120;

      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 250, 60);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const points = [];

      for (let y = 0; y < canvas.height; y += 2) {
        for (let x = 0; x < canvas.width; x += 2) {
          const index = (y * canvas.width + x) * 4;
          if (imgData.data[index] > 128) {
            points.push({
              x: (x - 250) * 0.35,
              y: (60 - y) * 0.35
            });
          }
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = points[i % points.length];
        targetPositions[i * 3] = pt.x + (Math.random() - 0.5) * 0.5;
        targetPositions[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.5;
        targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 2;

        targetColors[i * 3] = r;
        targetColors[i * 3 + 1] = g;
        targetColors[i * 3 + 2] = b;
      }
    }

    // 3. Loop Animasi (Rotasi Dipercepat)
    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      const posAttr = particleSystem.geometry.attributes.position;
      const colAttr = particleSystem.geometry.attributes.color;

      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.08;
        colors[i] += (targetColors[i] - colors[i]) * 0.08;
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;

      // Kecepatan putar ditambah (Dinaikkan dari 0.002 menjadi 0.012)
      particleSystem.rotation.y += 0.012;
      particleSystem.rotation.x += 0.003;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 4. Deteksi Gestur Jari
    function detectGesture(landmarks) {
      const isExtended = (tip, pip) => landmarks[tip].y < landmarks[pip].y;

      const index = isExtended(8, 6);
      const middle = isExtended(12, 10);
      const ring = isExtended(16, 14);
      const pinky = isExtended(20, 18);

      // Cek apakah tangan mengarah ke atas (Telunjuk ke atas 👆)
      const isPointingUp = landmarks[8].y < landmarks[5].y - 0.1;

      // ✌️ Peace (I LOVE YOU)
      if (index && middle && !ring && !pinky) return 'v_sign';
      
      // ☝️ / 👆 Jari Telunjuk
      if (index && !middle && !ring && !pinky) {
        return isPointingUp ? 'point_up_hand' : 'one_finger';
      }

      // ✋ Telapak Terbuka (Mencar)
      if (index && middle && ring && pinky) return 'open_palm';
      
      // ✊ Kepalan (Love)
      if (!index && !middle && !ring && !pinky) return 'fist';

      return null;
    }

    function setMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      switch (mode) {
        case 'v_sign':
          generateTextTarget('I LOVE YOU', 0.2, 1.0, 0.5);
          break;
        case 'one_finger': // ☝️ Saturnus
          generateSaturnTarget();
          break;
        case 'point_up_hand': // 👆 km syg aq g
          generateTextTarget('km syg aq g', 1.0, 0.4, 0.8);
          break;
        case 'fist': // ✊ Love
          generateHeartTarget(2.0, 1.0, 0.1, 0.3);
          break;
        case 'open_palm': // ✋ Mencar
          generateScatterTarget();
          break;
      }
    }

    // 5. Inisialisasi MediaPipe Hands
    const videoElement = document.getElementById('webcam');
    const loadingElement = document.getElementById('loading');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      loadingElement.style.display = 'none';
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const gesture = detectGesture(results.multiHandLandmarks[0]);
        if (gesture) setMode(gesture);
      }
    });

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 480,
      height: 360
    });

    initThree();
    cameraUtils.start();
  </script>
</body>
</html>
